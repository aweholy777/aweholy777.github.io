# hugo.toml (根據新需求和圖片生成)


#baseURL = "https://aweholy777.github.io/" # !! 請務必更新為您最終的 GitHub Pages 網址 !!

baseURL = "https://cmtc.tw/"
languageCode = "zh-TW"
# 站台語言。defaultContentLanguage 必須全小寫（寫 "zh-TW" 會報 does not match any language definition）；
# 沒設時 <html lang> 會是 en，行動版選單按鈕與 404 頁也會是英文。
defaultContentLanguage = "zh-tw"
# 中日韓文字依「字」計算字數與摘要（沒設時一篇三千字的 QT 只會被算成 54 字）
hasCJKLanguage = true
title = "城市宣培中心"
theme = "mainroad"
# 限制 RSS 篇數，避免 index.xml 突破 Cloudflare Pages 25 MiB 單檔上限
rssLimit = 50
# 不產生空的分類／標籤頁：站內文章沒有使用分類與標籤，開著只會多出 /categories/、/tags/ 兩個空頁
disableKinds = ["taxonomy", "term"]
# 正確的 GA4 設定方式
[services]
  [services.googleAnalytics]
    ID = "G-99DBKKYEC1"

# 这样默认就会把未来内容编译进 public/。
[build]
  buildFuture = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    # 關閉刪除線擴充：本站經文範圍大量用 ~（如 1~14），不要被當成 ~~刪除線~~。
    # 關掉後單一/多個 ~ 一律顯示為字面波浪號，內文用純 ~ 即可，不需跳脫。
    [markup.goldmark.extensions]
      strikethrough = false


# 分頁設定
[pagination]
  pagerSize = 10

# 搜尋索引分片：避免單一 index.json 突破 Cloudflare Pages 25 MiB 上限
[outputFormats]
  [outputFormats.search_ot1]
    mediaType = "application/json"
    baseName = "index-ot1"
    isPlainText = true
    notAlternative = true
  [outputFormats.search_ot2]
    mediaType = "application/json"
    baseName = "index-ot2"
    isPlainText = true
    notAlternative = true
  [outputFormats.search_nt]
    mediaType = "application/json"
    baseName = "index-nt"
    isPlainText = true
    notAlternative = true
  [outputFormats.search_other]
    mediaType = "application/json"
    baseName = "index-other"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "search_ot1", "search_ot2", "search_nt", "search_other"]

# 主題參數
[params]
  description = "城市宣培中心 | City Ministration Training Center"
  opengraph = true
  schema = true
  twitter_cards = true
  # 僅全站共用 CSS；qt-library / qt-index / qt-article 改於 baseof.html 按頁條件載入
  customCSS = ["css/custom.css"]


  # --- 新增或修改 Logo 設定 ---
  [params.logo]
    image = "/images/logo.png"  # <-- 重要：指向您放在 static 文件夾下的圖片路徑
                               #     (如果放在 static/logo.png, 就寫 "/logo.png")
                               #     開頭的 / 代表相對於 static 目錄
    width = 360                # 可選：設定 Logo 圖片寬度 (單位 px)，請自行調整
    height = 120               # 可選：設定 Logo 圖片高度 (單位 px)，請自行調整
    alt = "城市宣培中心 Logo"   # 可選但建議：圖片的替代文字，用於 SEO 和可訪問性
  # --- Logo 設定結束 ---




