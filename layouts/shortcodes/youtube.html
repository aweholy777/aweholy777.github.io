{{- /* 覆寫 Hugo 內建 youtube shortcode：在影片上方加明顯間距（約 3 行），全站一次生效 */ -}}
{{- $id := or (.Get "id") (.Get 0) -}}
<div class="qt-video" style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-top:4.5em;">
  <iframe src="https://www.youtube.com/embed/{{ $id }}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen loading="lazy" title="YouTube video"></iframe>
</div>
