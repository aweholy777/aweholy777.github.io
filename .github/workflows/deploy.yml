# .github/workflows/deploy.yml
# Hugo 建置檢查（正式站部署由 Cloudflare Pages 負責，不再重複部署至 GitHub Pages）
# 只在網站核心檔案變動或手動觸發時執行，避免 Mac 每小時上傳影片時空跑 CI。

name: Hugo Build Check

on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "functions/**"
      - "hugo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "hugo-build-check"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.144.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --buildFuture
      - name: 檢查輸出檔案不得接近 Cloudflare Pages 25 MiB 上限
        run: |
          # 20 MiB 警戒線（CF 硬上限 25 MiB）
          BIG=$(find public -type f -size +20971520c)
          if [ -n "$BIG" ]; then
            echo "❌ 發現超過 20 MiB 的輸出檔（接近 CF 25 MiB 上限）："
            ls -lh $BIG
            exit 1
          fi
          echo "✅ 所有輸出檔案均低於 20 MiB"
