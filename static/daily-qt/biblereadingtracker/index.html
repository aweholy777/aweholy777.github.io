<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>聖經已讀統計｜可勾選與自動記錄</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-soft: #172033;
      --panel: rgba(17, 24, 39, .74);
      --panel-solid: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-2: #60a5fa;
      --border: rgba(148, 163, 184, .22);
      --chip: rgba(2, 6, 23, .62);
      --shadow: rgba(2, 6, 23, .35);
      --link: #93c5fd;
    }

    body[data-theme="warm"] {
      color-scheme: light;
      --bg: #fff4df;
      --bg-soft: #ffe3b3;
      --panel: rgba(255, 251, 235, .84);
      --panel-solid: #fff7ed;
      --text: #3f2414;
      --muted: #815f44;
      --accent: #c2410c;
      --accent-2: #d97706;
      --border: rgba(146, 64, 14, .22);
      --chip: rgba(255, 247, 237, .82);
      --shadow: rgba(120, 53, 15, .13);
      --link: #9a3412;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(900px 520px at 8% -10%, var(--bg-soft), transparent 58%),
        radial-gradient(760px 460px at 112% 0%, rgba(96, 165, 250, .18), transparent 54%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    body[data-theme="warm"] {
      background:
        radial-gradient(900px 520px at 8% -10%, #ffdca3, transparent 58%),
        radial-gradient(760px 460px at 112% 0%, #f9b66d, transparent 56%),
        var(--bg);
    }

    header {
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: saturate(150%) blur(14px);
      padding: 12px 12px 10px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }

    .head-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(19px, 2.4vw, 26px);
      font-weight: 800;
    }

    a { color: var(--link); }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    button, label.btn {
      border: 1px solid var(--border);
      background: var(--chip);
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
      min-height: 36px;
      padding: 7px 12px;
      cursor: pointer;
    }

    button:hover, label.btn:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent-2) 42%, transparent);
      outline-offset: 2px;
    }

    .theme-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border);
      background: var(--chip);
      border-radius: 10px;
    }

    .theme-switch button {
      min-height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      padding: 4px 10px;
      font-size: 13px;
    }

    .theme-switch button[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    progress {
      width: min(200px, 100%);
      height: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--chip);
      vertical-align: middle;
    }

    progress::-webkit-progress-bar { background: var(--chip); }
    progress::-webkit-progress-value { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    progress::-moz-progress-bar { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: var(--chip);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 14px;
      user-select: none;
    }

    .stat b { font-weight: 800; }

    input[type="search"], input[type="file"] {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--chip);
      color: var(--text);
      padding: 7px 12px;
      font-size: 14px;
      outline: none;
    }

    input[type="search"] { width: min(360px, 100%); }

    .note, .foot {
      color: var(--muted);
      font-size: 12px;
    }

    /* ---- 一頁式總覽：66 卷排成緊湊格（收合狀態） ---- */
    .overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas: "name meta" "bar bar";
      align-items: baseline;
      gap: 2px 8px;
      width: 100%;
      min-height: 46px;
      padding: 7px 10px 8px;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      box-shadow: 0 6px 18px var(--shadow);
      font: inherit;
      color: var(--text);
      cursor: pointer;
    }

    .card:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      transform: translateY(-1px);
    }

    .card .name {
      grid-area: name;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card .meta {
      grid-area: meta;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .card .bar {
      grid-area: bar;
      height: 6px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--panel-solid) 60%, transparent);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .card.is-done { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .card.is-done .name::after { content: " ✓"; color: var(--accent); font-weight: 800; }

    .empty {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 26px 16px;
      color: var(--muted);
      text-align: center;
    }

    /* ---- 展開全部：整頁攤平，66 卷的章節格子一起列出（整頁一起捲動） ---- */
    .flat-book {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 6px 18px var(--shadow);
      overflow: hidden;
    }

    .flat-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
    }

    .flat-head h2 { margin: 0; font-size: 15px; font-weight: 800; }

    .flat-head .meta { color: var(--muted); font-size: 12px; }

    .flat-head .spacer { flex: 1; }

    .flat-head button { min-height: 28px; padding: 4px 9px; font-size: 12px; }

    .flat-body { padding: 10px 12px 14px; }

    /* ---- 章節格子（彈出視窗與攤平共用） ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 8px;
    }

    .cell {
      display: flex;
      min-height: 40px;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: color-mix(in srgb, var(--panel) 80%, transparent);
      padding: 7px 8px;
      font-size: 14px;
      font-weight: 650;
    }

    .cell input[type="checkbox"] {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .cell > span { min-width: 1.6em; text-align: left; }

    .cell.read {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-solid));
    }

    .cell.flash { outline: 3px solid var(--accent-2); outline-offset: 1px; }

    /* ---- 彈出視窗：單卷章節（收合狀態下點卡片用） ---- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(2, 6, 23, .55);
    }

    .modal[hidden] { display: none; }

    .dialog {
      width: min(600px, 100%);
      max-height: min(84vh, 780px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel-solid);
      box-shadow: 0 24px 60px rgba(2, 6, 23, .45);
      overflow: hidden;
    }

    .dialog-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .dialog-head h2 { margin: 0; font-size: 17px; font-weight: 800; }

    .dialog-head .meta { color: var(--muted); font-size: 13px; }

    .dialog-head .spacer { flex: 1; }

    .dialog-body { overflow: auto; padding: 12px 14px 16px; }

    .foot { margin-top: 18px; text-align: center; }

    .hidden { display: none !important; }

    @media (max-width: 560px) {
      .container { padding-inline: 10px; }
      .overview { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 7px; }
      .head-actions > *, .head-actions input[type="search"] { flex: 1 1 auto; }
      .modal { padding: 8px; }
    }
  </style>
</head>
<body data-theme="warm">
  <header>
    <div class="container">
      <div class="head-row">
        <h1>聖經已讀統計</h1>
        <span class="stat">全書 <b id="totalChapters">-</b> 章　已讀 <b id="readCount">0</b>（<b id="percent">0</b>%）</span>
        <progress id="progress" value="0" max="1189" aria-label="總進度"></progress>
      </div>
      <div class="head-actions">
        <input id="search" type="search" placeholder="搜尋書卷，例如：創、約翰福音" autocomplete="off" aria-label="搜尋書卷" />
        <span class="theme-switch" aria-label="背景主題">
          <button id="themeDark" type="button" aria-pressed="false">深色</button>
          <button id="themeWarm" type="button" aria-pressed="true">暖色</button>
        </span>
        <button id="toggleUnread" type="button" aria-pressed="false">只看未讀完</button>
        <button id="expandAll" type="button" aria-pressed="false">展開全部</button>
        <button id="exportBtn" type="button">匯出進度</button>
        <label class="btn">
          匯入進度
          <input id="importInput" type="file" accept="application/json" class="hidden" />
        </label>
        <button id="resetAll" type="button">全部清除</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="overview" class="overview" aria-label="66 卷總覽"></section>
    <div id="flatView" hidden></div>
    <div class="foot">v2.1 · 一頁式整頁捲動 · 資料只存在這台裝置的瀏覽器，不會上傳 · <a href="/">← 回 cmtc.tw</a></div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <span class="meta" id="dialogMeta"></span>
        <span class="spacer"></span>
        <button id="markAll" type="button">全選</button>
        <button id="clearBook" type="button">清除</button>
        <button id="closeModal" type="button" aria-label="關閉">✕</button>
      </div>
      <div class="dialog-body">
        <div class="grid" id="chapterGrid"></div>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = "bibleProgress";
const THEME_KEY = "bibleTrackerTheme";

const bibleData = [
  ["創世記", 50], ["出埃及記", 40], ["利未記", 27], ["民數記", 36], ["申命記", 34],
  ["約書亞記", 24], ["士師記", 21], ["路得記", 4], ["撒母耳記上", 31], ["撒母耳記下", 24],
  ["列王紀上", 22], ["列王紀下", 25], ["歷代志上", 29], ["歷代志下", 36], ["以斯拉記", 10],
  ["尼希米記", 13], ["以斯帖記", 10], ["約伯記", 42], ["詩篇", 150], ["箴言", 31],
  ["傳道書", 12], ["雅歌", 8], ["以賽亞書", 66], ["耶利米書", 52], ["耶利米哀歌", 5],
  ["以西結書", 48], ["但以理書", 12], ["何西阿書", 14], ["約珥書", 3], ["阿摩司書", 9],
  ["俄巴底亞書", 1], ["約拿書", 4], ["彌迦書", 7], ["那鴻書", 3], ["哈巴谷書", 3],
  ["西番雅書", 3], ["哈該書", 2], ["撒迦利亞書", 14], ["瑪拉基書", 4],
  ["馬太福音", 28], ["馬可福音", 16], ["路加福音", 24], ["約翰福音", 21], ["使徒行傳", 28],
  ["羅馬書", 16], ["哥林多前書", 16], ["哥林多後書", 13], ["加拉太書", 6], ["以弗所書", 6],
  ["腓立比書", 4], ["歌羅西書", 4], ["帖撒羅尼迦前書", 5], ["帖撒羅尼迦後書", 3],
  ["提摩太前書", 6], ["提摩太後書", 4], ["提多書", 3], ["腓利門書", 1], ["希伯來書", 13],
  ["雅各書", 5], ["彼得前書", 5], ["彼得後書", 3], ["約翰一書", 5], ["約翰二書", 1],
  ["約翰三書", 1], ["猶大書", 1], ["啟示錄", 22]
];

const aliases = new Map([
  ["genesis", "創世記"], ["exo", "出埃及記"], ["exodus", "出埃及記"], ["john", "約翰福音"],
  ["romans", "羅馬書"], ["psalm", "詩篇"], ["psalms", "詩篇"], ["proverbs", "箴言"],
  ["matthew", "馬太福音"], ["mark", "馬可福音"], ["luke", "路加福音"], ["acts", "使徒行傳"],
  ["revelation", "啟示錄"]
]);

const totalChapters = bibleData.reduce((sum, [, chapters]) => sum + chapters, 0);

const els = {
  overview: document.getElementById("overview"),
  flatView: document.getElementById("flatView"),
  expandAll: document.getElementById("expandAll"),
  totalChapters: document.getElementById("totalChapters"),
  readCount: document.getElementById("readCount"),
  percent: document.getElementById("percent"),
  progress: document.getElementById("progress"),
  search: document.getElementById("search"),
  toggleUnread: document.getElementById("toggleUnread"),
  themeDark: document.getElementById("themeDark"),
  themeWarm: document.getElementById("themeWarm"),
  modal: document.getElementById("modal"),
  dialogTitle: document.getElementById("dialogTitle"),
  dialogMeta: document.getElementById("dialogMeta"),
  chapterGrid: document.getElementById("chapterGrid"),
  markAll: document.getElementById("markAll"),
  clearBook: document.getElementById("clearBook"),
  closeModal: document.getElementById("closeModal")
};

const state = {
  progress: loadProgress(),
  hideFinished: false,
  query: "",
  flatMode: false,      // false＝總覽（收合）；true＝全部攤平，整頁一起捲動
  openBook: null,       // 彈出視窗目前顯示的書卷名
  highlightChapter: null
};

const cardEls = new Map();   // 總覽模式：書卷名 → 卡片元素
const flatMetaEls = new Map(); // 攤平模式：書卷名 → 進度文字元素

els.totalChapters.textContent = totalChapters;
els.progress.max = totalChapters;

function loadProgress() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return normalizeProgress(value && typeof value === "object" ? value : {});
  } catch {
    return {};
  }
}

function normalizeProgress(data) {
  const normalized = {};
  for (const [book, chapters] of Object.entries(data)) {
    if (!chapters || typeof chapters !== "object" || Array.isArray(chapters)) continue;
    normalized[book] = {};
    for (const [chapter, value] of Object.entries(chapters)) {
      if (value) normalized[book][chapter] = true;
    }
    if (Object.keys(normalized[book]).length === 0) delete normalized[book];
  }
  return normalized;
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
  updateStats();
}

function normalize(value) {
  return String(value).trim().toLowerCase();
}

function parseSearch(query) {
  const normalized = normalize(query);
  if (!normalized) return { book: "", chapter: null };
  const match = normalized.match(/^(.+?)\s*(\d+)$/);
  if (!match) return { book: aliases.get(normalized) || normalized, chapter: null };
  const rawBook = normalize(match[1]);
  return { book: aliases.get(rawBook) || rawBook, chapter: Number(match[2]) };
}

function bookOf(name) {
  return bibleData.find(([n]) => n === name);
}

function getBookProgress(name) {
  return state.progress[name] || {};
}

function readCountOf(name) {
  return Object.keys(getBookProgress(name)).length;
}

function isRead(name, chapter) {
  return Boolean(getBookProgress(name)[chapter]);
}

function setRead(name, chapter, checked) {
  if (!state.progress[name]) state.progress[name] = {};
  if (checked) {
    state.progress[name][chapter] = true;
  } else {
    delete state.progress[name][chapter];
    if (Object.keys(state.progress[name]).length === 0) delete state.progress[name];
  }
}

function updateStats() {
  const read = Object.values(state.progress).reduce((sum, chapters) => {
    return sum + Object.values(chapters).filter(Boolean).length;
  }, 0);
  els.readCount.textContent = read;
  els.percent.textContent = ((read / totalChapters) * 100).toFixed(1);
  els.progress.value = read;
}

// 更新「某卷」在目前版面上的進度顯示（卡片或攤平標題）
function updateBookMeta(name) {
  const chapters = bookOf(name)[1];
  const read = readCountOf(name);
  const card = cardEls.get(name);
  if (card) {
    card.querySelector(".meta").textContent = `${read}/${chapters}`;
    card.querySelector(".bar i").style.width = `${(read / chapters) * 100}%`;
    card.classList.toggle("is-done", read === chapters);
  }
  const flat = flatMetaEls.get(name);
  if (flat) flat.textContent = `已讀 ${read} / ${chapters} 章`;
}

function visibleBooks() {
  const search = parseSearch(state.query);
  return bibleData.filter(([name, chapters]) => {
    if (state.hideFinished && readCountOf(name) === chapters) return false;
    if (search.book && !normalize(name).includes(normalize(search.book))) return false;
    return true;
  });
}

function renderOverview() {
  if (state.flatMode) renderFlat();
  else renderCompact();
}

/* ---- 總覽（收合）：66 卷卡片，點卡片彈出章節視窗 ---- */
function renderCompact() {
  els.flatView.hidden = true;
  els.flatView.innerHTML = "";
  flatMetaEls.clear();
  els.overview.hidden = false;
  els.overview.innerHTML = "";
  cardEls.clear();
  let visible = 0;

  for (const [name, chapters] of visibleBooks()) {
    const read = readCountOf(name);
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card" + (read === chapters ? " is-done" : "");
    card.dataset.book = name;
    card.setAttribute("aria-haspopup", "dialog");
    card.setAttribute("aria-label", `${name}，已讀 ${read} 章，共 ${chapters} 章，點開勾選章節`);

    const nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = name;

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `${read}/${chapters}`;

    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = `${(read / chapters) * 100}%`;
    bar.append(fill);

    card.append(nameEl, meta, bar);
    card.addEventListener("click", () => openModal(name));
    els.overview.appendChild(card);
    cardEls.set(name, card);
    visible++;
  }

  if (!visible) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = state.hideFinished ? "讀完的卷已隱藏，或找不到符合的書卷" : "找不到符合的書卷";
    els.overview.appendChild(empty);
  }
  updateStats();
}

/* ---- 展開全部：66 卷的章節格子直接攤平在整頁裡，一起捲動 ---- */
function renderFlat() {
  els.overview.hidden = true;
  els.overview.innerHTML = "";
  cardEls.clear();
  els.flatView.hidden = false;
  els.flatView.innerHTML = "";
  flatMetaEls.clear();

  const search = parseSearch(state.query);
  let visible = 0;

  for (const [name, chapters] of visibleBooks()) {
    const section = document.createElement("section");
    section.className = "flat-book";
    section.dataset.book = name;

    const head = document.createElement("div");
    head.className = "flat-head";

    const title = document.createElement("h2");
    title.textContent = name;

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `已讀 ${readCountOf(name)} / ${chapters} 章`;

    const spacer = document.createElement("span");
    spacer.className = "spacer";

    const markAll = document.createElement("button");
    markAll.type = "button";
    markAll.textContent = "全選";
    markAll.addEventListener("click", () => {
      for (let i = 1; i <= chapters; i++) setRead(name, i, true);
      refreshFlatBook(name);
      saveProgress();
    });

    const clearAll = document.createElement("button");
    clearAll.type = "button";
    clearAll.textContent = "清除";
    clearAll.addEventListener("click", () => {
      for (let i = 1; i <= chapters; i++) setRead(name, i, false);
      refreshFlatBook(name);
      saveProgress();
    });

    head.append(title, meta, spacer, markAll, clearAll);

    const body = document.createElement("div");
    body.className = "flat-body";
    const grid = document.createElement("div");
    grid.className = "grid";

    for (let chapter = 1; chapter <= chapters; chapter++) {
      grid.appendChild(buildCell(name, chapter, () => {
        updateFlatMetaByName(name);
        updateStats();
        saveProgress();
      }));
    }

    body.append(grid);
    section.append(head, body);
    els.flatView.appendChild(section);
    flatMetaEls.set(name, meta);
    visible++;
  }

  if (!visible) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = state.hideFinished ? "讀完的卷已隱藏，或找不到符合的書卷" : "找不到符合的書卷";
    els.flatView.appendChild(empty);
  }

  if (search.chapter) {
    const target = els.flatView.querySelector(`.flat-book[data-book="${search.book}"] .cell[data-chapter="${search.chapter}"]`);
    if (target) {
      target.classList.add("flash");
      setTimeout(() => target.classList.remove("flash"), 1600);
    }
  }
  updateStats();
}

function updateFlatMetaByName(name) {
  const meta = flatMetaEls.get(name);
  if (meta) {
    const chapters = bookOf(name)[1];
    meta.textContent = `已讀 ${readCountOf(name)} / ${chapters} 章`;
  }
}

function refreshFlatBook(name) {
  els.flatView.querySelectorAll(`.flat-book[data-book="${name}"] .cell`).forEach((cell) => {
    const chapter = Number(cell.dataset.chapter);
    const box = cell.querySelector("input");
    box.checked = isRead(name, chapter);
    cell.classList.toggle("read", box.checked);
  });
  updateFlatMetaByName(name);
}

/* 共用：建立一個章節格子 */
function buildCell(name, chapter, onChange) {
  const cell = document.createElement("label");
  cell.className = "cell";
  cell.dataset.chapter = chapter;

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = isRead(name, chapter);
  box.addEventListener("change", () => {
    setRead(name, chapter, box.checked);
    cell.classList.toggle("read", box.checked);
    onChange();
  });

  const num = document.createElement("span");
  num.textContent = chapter;
  cell.append(box, num);
  return cell;
}

/* ---- 彈出視窗（總覽模式下點卡片用） ---- */
function openModal(name) {
  const chapters = bookOf(name)[1];
  state.openBook = name;
  state.highlightChapter = parseSearch(state.query).chapter;

  els.dialogTitle.textContent = name;
  els.chapterGrid.innerHTML = "";

  for (let chapter = 1; chapter <= chapters; chapter++) {
    els.chapterGrid.appendChild(buildCell(name, chapter, () => {
      updateDialogMeta();
      updateBookMeta(name);
      updateStats();
      saveProgress();
    }));
  }

  updateDialogMeta();
  els.modal.hidden = false;
  document.documentElement.style.overflow = "hidden";
  els.closeModal.focus();

  if (state.highlightChapter && state.highlightChapter <= chapters) {
    const target = els.chapterGrid.querySelector(`[data-chapter="${state.highlightChapter}"]`);
    if (target) {
      target.classList.add("flash");
      target.scrollIntoView({ block: "center" });
      setTimeout(() => target.classList.remove("flash"), 1600);
    }
  }
}

function updateDialogMeta() {
  if (!state.openBook) return;
  const chapters = bookOf(state.openBook)[1];
  els.dialogMeta.textContent = `已讀 ${readCountOf(state.openBook)} / ${chapters} 章`;
}

function closeModal() {
  if (els.modal.hidden) return;
  els.modal.hidden = true;
  els.chapterGrid.innerHTML = "";
  state.openBook = null;
  document.documentElement.style.overflow = "";
}

els.closeModal.addEventListener("click", closeModal);
els.modal.addEventListener("click", (event) => {
  if (event.target === els.modal) closeModal();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
});

els.markAll.addEventListener("click", () => {
  if (!state.openBook) return;
  const chapters = bookOf(state.openBook)[1];
  for (let i = 1; i <= chapters; i++) setRead(state.openBook, i, true);
  els.chapterGrid.querySelectorAll(".cell").forEach((cell) => {
    const chapter = Number(cell.dataset.chapter);
    const box = cell.querySelector("input");
    box.checked = isRead(state.openBook, chapter);
    cell.classList.toggle("read", box.checked);
  });
  updateDialogMeta();
  updateBookMeta(state.openBook);
  saveProgress();
});

els.clearBook.addEventListener("click", () => {
  if (!state.openBook) return;
  const chapters = bookOf(state.openBook)[1];
  for (let i = 1; i <= chapters; i++) setRead(state.openBook, i, false);
  els.chapterGrid.querySelectorAll(".cell").forEach((cell) => {
    const chapter = Number(cell.dataset.chapter);
    const box = cell.querySelector("input");
    box.checked = isRead(state.openBook, chapter);
    cell.classList.toggle("read", box.checked);
  });
  updateDialogMeta();
  updateBookMeta(state.openBook);
  saveProgress();
});

/* ---- 工具列 ---- */
els.expandAll.addEventListener("click", () => {
  state.flatMode = !state.flatMode;
  els.expandAll.textContent = state.flatMode ? "收合全部" : "展開全部";
  els.expandAll.setAttribute("aria-pressed", String(state.flatMode));
  renderOverview();
});

els.toggleUnread.addEventListener("click", () => {
  state.hideFinished = !state.hideFinished;
  els.toggleUnread.textContent = state.hideFinished ? "顯示全部" : "只看未讀完";
  els.toggleUnread.setAttribute("aria-pressed", String(state.hideFinished));
  renderOverview();
});

els.search.addEventListener("input", (event) => {
  state.query = event.target.value;
  renderOverview();
});

document.getElementById("resetAll").addEventListener("click", () => {
  if (!confirm("確定要清除全部紀錄嗎？")) return;
  localStorage.removeItem(STORAGE_KEY);
  state.progress = {};
  closeModal();
  renderOverview();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state.progress, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "bible-progress.json";
  link.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importInput").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.addEventListener("load", () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("Invalid data");
      state.progress = normalizeProgress(data);
      saveProgress();
      renderOverview();
    } catch {
      alert("匯入失敗：檔案格式錯誤");
    } finally {
      event.target.value = "";
    }
  });
  reader.readAsText(file);
});

function setTheme(theme) {
  const activeTheme = theme === "dark" ? "dark" : "warm";
  document.body.dataset.theme = activeTheme;
  localStorage.setItem(THEME_KEY, activeTheme);
  els.themeDark.setAttribute("aria-pressed", String(activeTheme === "dark"));
  els.themeWarm.setAttribute("aria-pressed", String(activeTheme === "warm"));
}

els.themeDark.addEventListener("click", () => setTheme("dark"));
els.themeWarm.addEventListener("click", () => setTheme("warm"));

setTheme(localStorage.getItem(THEME_KEY) || "warm");
renderOverview();
</script>
</body>
</html>
